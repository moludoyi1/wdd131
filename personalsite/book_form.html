<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Mady Handy Hair and Beauty</title>
    <link rel="stylesheet" href="style.css" />
    <!-- <script type="module" src="main.js" defer></script> -->
    <!--link google fonts here-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Luckiest+Guy&family=Roboto+Slab:wght@300&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
  </head>
  <body>
    <!--header section-->
    <header>
      <div class="header_container">
        <div class="business_name">
          <h1>Mady Handy Hair and Beauty</h1>
        </div>

        <!-- add a logo below -->
        <img
          src="./images/madyhair_logo.png"
          alt="Mady Handy Hair and Beauty Logo"
        />

        <nav>
          <ul>
            <li><a href="#services">Services</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#book_form.html" class="book-btn">Book Now</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!-- <div class="bkn-container">
            <h2 class="bkn-title">Schedule an appointment today!!</h2>
            <a href="index.html" class="back-link">Back to Home</a>
        </div> -->

      <section class="booking-form-section">
        <h3>A step closer to achieving that glam</h3>
        <form id="bookingForm">
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="phone">Phone Number:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            aria-required="true"
            placeholder="e.g. +1 (555) 123-4567"
            pattern="\+?[0-9\s()-]+"
            title="Please enter a valid phone number"
          />

          <label for="service">Service</label>
          <select id="service" name="service" required>
            <option value="">Select a Service</option>
            <option value="Full Balayage">Full Balayage</option>
            <option value="Partial Balayage">Partial Balayage</option>
            <option value="Color Up to 4oz">Color Up to 4oz</option>
            <option value="Full Foil">Full Foil</option>
            <option value="Partial Foil">Partial Foil</option>
          </select>

          <label for="date">Appointment Date</label>
          <input type="date" id="date" name="date" required />

          <label for="time">Appointment Time</label>
          <input type="time" id="time" name="time" required step="900" />

          <button type="submit" class="submit-btn">Book Now</button>
        </form>
      </section>
    </main>

    <!--Footer Section-->
    <footer>
      <p>&copy; 2024 Mady Handy Hair and Beauty. All rights reserved.</p>
      <div class="social">
        <a
          href="https://www.instagram.com/madyhandy.hair/profilecard/?igsh=MXdkNDlhYXRzbjA3OQ=="
          ><img src="images/instagram_icon.svg" alt="Instagram icon"
        /></a>
        <!-- <i class="fa-brand fa-facebook"></i> -->
        <!-- <a href="#"><img src="" alt="Facebook icon"></a> -->
      </div>
      <div class="back2top_btn"></div>
    </footer>
  </body>
</html>
